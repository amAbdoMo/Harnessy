name: Harnessy Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-checks:
    name: desktop checks / Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Type-check the desktop host
        shell: pwsh
        run: pnpm exec tsc -b tsconfig.host.json --pretty false

      - name: Test Windows packaging policy
        shell: pwsh
        run: pnpm exec vitest run apps/desktop/tests/package-target.spec.ts apps/desktop/tests/macos-signature.spec.ts

  unsigned-installer:
    name: unsigned installer / Windows x64
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-installer]'))
    needs: desktop-checks
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure the unsigned Harnessy package
        shell: pwsh
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.amabdmo.customharness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com'
          ) | Set-Content -LiteralPath apps/desktop/.env.windows -Encoding utf8

      - name: Build and verify the installer
        shell: pwsh
        run: |
          pnpm run package:desktop:win:x64:local *>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report an installer failure
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content -LiteralPath installer-build.log -Tail 12) -join "`n"
          $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Installer packaging failed::$annotation"

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-installer-diagnostics-${{ github.sha }}
          path: installer-build.log
          if-no-files-found: error

      - name: Upload the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-unsigned-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**
          if-no-files-found: error
          compression-level: 0
