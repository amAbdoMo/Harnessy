name: Harnessy Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Approved stable in-app release version; empty builds only the local installer'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_version != '' && 'release-build' || github.ref }}
  cancel-in-progress: ${{ inputs.release_version == '' }}

permissions:
  contents: read

jobs:
  desktop-checks:
    name: desktop checks / Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify the Harnessy product
        shell: pwsh
        run: pnpm run verify:harnessy-product

      - name: Verify saved settings and unread badges
        shell: pwsh
        run: pnpm run verify:harnessy-upgrade

      - name: Verify model connection recovery
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/llm/llm-pi-ai/tests/convert.spec.ts
          packages/llm/llm-pi-ai/tests/codex-socket.spec.ts
          packages/llm/llm-pi-ai/tests/fetch-errors.spec.ts
          packages/llm/llm-pi-ai/tests/adapter.spec.ts
          packages/llm/llm-retry/tests/retry.spec.ts
          packages/llm/llm-retry/tests/transport-recovery.spec.ts
          packages/llm/llm-retry/tests/loader-composition.spec.ts
          packages/llm/llm-retry/tests/persistence.spec.ts

      - name: Build and type-check Harnessy
        shell: pwsh
        run: pnpm run build:custom-harness

      - name: Install account-chooser browser
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Test live account surfaces
        shell: pwsh
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/accounts-live-usage.expected.e2e.ts apps/web/tests/banked-reset-chooser.e2e.ts

      - name: Test Windows packaging policy
        shell: pwsh
        run: pnpm exec vitest run scripts/ci-workflow.spec.ts apps/desktop/tests/package-target.spec.ts apps/desktop/tests/macos-signature.spec.ts

  unsigned-installer:
    name: unsigned installer / Windows x64
    if: (github.event_name == 'workflow_dispatch' && inputs.release_version == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-installer]'))
    needs: desktop-checks
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure the unsigned Harnessy package
        shell: pwsh
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.amabdmo.customharness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com'
          ) | Set-Content -LiteralPath apps/desktop/.env.windows -Encoding utf8

      - name: Build and verify the installer
        shell: pwsh
        run: |
          pnpm run package:desktop:win:x64:local *>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report an installer failure
        if: failure()
        shell: pwsh
        run: |
          $sections = [System.Collections.Generic.List[string]]::new()
          $sections.Add('=== installer-build.log matches ===')
          $matches = Select-String -LiteralPath installer-build.log -Pattern 'Error:|ERR_|ENOENT|not found|failed|desktop smoke|Host smoke|payload smoke'
          foreach ($match in @($matches | Select-Object -Last 30)) {
            $sections.Add($match.Line)
          }

          $runs = 'apps/desktop/.desktop-build/packaging-runs'
          $run = Get-ChildItem -LiteralPath $runs -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -ne $run) {
            $sections.Add("=== packaging run $($run.Name) ===")
            foreach ($name in @('stderr.log', 'stdout.log', 'fatal.json', 'result.json', 'events.jsonl')) {
              $path = Join-Path $run.FullName $name
              if (Test-Path -LiteralPath $path) {
                $sections.Add("=== $name ===")
                foreach ($line in @(Get-Content -LiteralPath $path -Tail 40)) {
                  $sections.Add($line)
                }
              }
            }
          } else {
            $sections.Add('No desktop packaging run directory was created.')
          }

          $report = [string]::Join("`n", $sections)
          if ($report.Length -gt 50000) {
            $report = $report.Substring(0, 50000)
          }
          $annotation = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Installer packaging failed::$annotation"

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-installer-diagnostics-${{ github.sha }}
          path: |
            installer-build.log
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: error

      - name: Upload the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-unsigned-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**
          if-no-files-found: error
          compression-level: 0

  release-package:
    name: qualified in-app update / Windows x64
    if: github.event_name == 'workflow_dispatch' && github.repository == 'amAbdoMo/Harnessy' && github.ref == 'refs/heads/staging' && inputs.release_version != ''
    needs: desktop-checks
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the approved release identity
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'A stable release version is required.' }
          foreach ($path in @('package.json', 'apps/desktop/package.json')) {
            $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if ($manifest.version -cne $version) { throw "Manifest version differs from the approved version: $path" }
          }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -cne $env:GITHUB_SHA) { throw 'The checkout differs from the dispatched commit.' }
          $tag = "v$version"
          $existing = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            $tagCommit = git rev-parse "$tag^{commit}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($tagCommit -cne $head) { throw 'The release tag identifies different source.' }
          } else {
            git tag $tag $head
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure the production Harnessy update
        shell: pwsh
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.amabdmo.customharness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com'
          ) | Set-Content -LiteralPath apps/desktop/.env.windows -Encoding utf8

      - name: Qualify the updater
        shell: pwsh
        run: pnpm run release:win:x64:qualify

      - name: Build the production update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/.desktop-build | Out-Null
          pnpm --dir apps/desktop run package:win:x64:release-unsigned *>&1 | Tee-Object -FilePath apps/desktop/.desktop-build/release-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the completed update package
        shell: pwsh
        run: |
          pnpm --dir apps/desktop run release:github:win:x64:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = 'apps/desktop/.desktop-build/targets/win-x64/artifacts'
          Copy-Item -LiteralPath "$artifacts/win-unpacked/resources/app-update.yml" -Destination "$artifacts/packaged-app-update.yml"

      - name: Upload the qualified update package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-release-${{ inputs.release_version }}-${{ github.sha }}
          path: |
            apps/desktop/.desktop-build/targets/win-x64/artifacts/Harnessy-Setup-${{ inputs.release_version }}-win-x64.exe
            apps/desktop/.desktop-build/targets/win-x64/artifacts/Harnessy-Setup-${{ inputs.release_version }}-win-x64.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/artifacts/latest.yml
            apps/desktop/.desktop-build/targets/win-x64/artifacts/win-x64-release.json
            apps/desktop/.desktop-build/targets/win-x64/artifacts/packaged-app-update.yml
          if-no-files-found: error
          compression-level: 0

      - name: Upload release build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-release-diagnostics-${{ github.sha }}
          path: |
            apps/desktop/.desktop-build/release-ci.log
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: warn
