name: Harnessy Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-checks:
    name: desktop checks / Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Type-check the desktop host
        shell: pwsh
        run: pnpm exec tsc -b tsconfig.host.json --pretty false

      - name: Test Windows packaging policy
        shell: pwsh
        run: pnpm exec vitest run apps/desktop/tests/package-target.spec.ts apps/desktop/tests/macos-signature.spec.ts

  unsigned-installer:
    name: unsigned installer / Windows x64
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-installer]'))
    needs: desktop-checks
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure the unsigned Harnessy package
        shell: pwsh
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.amabdmo.customharness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com'
          ) | Set-Content -LiteralPath apps/desktop/.env.windows -Encoding utf8

      - name: Build and verify the installer
        shell: pwsh
        run: |
          pnpm run package:desktop:win:x64:local *>&1 | Tee-Object -FilePath installer-build.log
          $packageExit = $LASTEXITCODE
          if ($packageExit -ne 0) {
            $retryable = Select-String -LiteralPath installer-build.log -SimpleMatch 'loadComponentFromURL returned an empty reference' -Quiet
            if (-not $retryable) { exit $packageExit }

            Write-Output 'LibreOffice reported its known empty-reference transient; retrying packaged-runtime verification once.' |
              Tee-Object -FilePath installer-build.log -Append
            $env:DSH_DESKTOP_TARGET_PLATFORM = 'win32'
            $env:DSH_DESKTOP_TARGET_ARCH = 'x64'
            pnpm --dir apps/desktop exec tsx scripts/smoke-packaged-runtime.ts --unsigned *>&1 |
              Tee-Object -FilePath installer-build.log -Append
            if ($LASTEXITCODE -ne 0) { exit $packageExit }
          }

      - name: Report an installer failure
        if: failure()
        shell: pwsh
        run: |
          $sections = [System.Collections.Generic.List[string]]::new()
          $sections.Add('=== installer-build.log matches ===')
          $matches = Select-String -LiteralPath installer-build.log -Pattern 'Error:|ERR_|ENOENT|not found|failed|desktop smoke|Host smoke|payload smoke'
          foreach ($match in @($matches | Select-Object -Last 30)) {
            $sections.Add($match.Line)
          }

          $runs = 'apps/desktop/.desktop-build/packaging-runs'
          $run = Get-ChildItem -LiteralPath $runs -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -ne $run) {
            $sections.Add("=== packaging run $($run.Name) ===")
            foreach ($name in @('stderr.log', 'stdout.log', 'fatal.json', 'result.json', 'events.jsonl')) {
              $path = Join-Path $run.FullName $name
              if (Test-Path -LiteralPath $path) {
                $sections.Add("=== $name ===")
                foreach ($line in @(Get-Content -LiteralPath $path -Tail 40)) {
                  $sections.Add($line)
                }
              }
            }
          } else {
            $sections.Add('No desktop packaging run directory was created.')
          }

          $report = [string]::Join("`n", $sections)
          if ($report.Length -gt 50000) {
            $report = $report.Substring(0, 50000)
          }
          $annotation = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Installer packaging failed::$annotation"

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-installer-diagnostics-${{ github.sha }}
          path: |
            installer-build.log
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: error

      - name: Upload the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Harnessy-windows-x64-unsigned-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**
          if-no-files-found: error
          compression-level: 0
