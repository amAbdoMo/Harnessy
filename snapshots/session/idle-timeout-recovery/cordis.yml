- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DSH_IDLE_TIMEOUT_FIXTURE_KEY
    baseURL: https://timeout-fixture.invalid
    streamIdleTimeoutMs: 1000
    retryPolicy:
      mode: normal
      maxRetries: 1
      backoff:
        initialDelayMs: 1
        maxDelayMs: 1
        jitterRatio: 0

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: idle-timeout-recovery
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/idle-timeout-recovery.ts'
