# Replay replaces the external model only; delegation uses the shipped provider.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
    - id: tool-subagent-depth
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: bounded_subagent
        maxDepth: 0
        enableRunInBackground: false
