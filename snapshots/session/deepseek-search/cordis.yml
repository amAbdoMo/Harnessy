- insert:
    - id: deepseek-search-fixture
      name: './deepseek-search-fixture.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-search-api
    fetchProvider: http

- id: web-deepseek-api
  name: '@deepseek-ai/dsh-web-deepseek-api'
  config:
    apiKey: snapshot-key
    baseURL: http://127.0.0.1:43118/api/v1/tools

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

# Keep this retrieval scenario independent of platform-provided skill catalogs.
- id: skill-badge
  disabled: true
