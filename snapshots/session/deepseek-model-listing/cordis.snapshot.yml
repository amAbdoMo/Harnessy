- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-model-listing-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: model-listing-replay
            name: Recorded model
            models:
              - id: fixture
    - id: live-model-listing
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: SNAPSHOT_LISTING_KEY
    - id: model-listing-fixture
      name: './model-listing-fixture.mjs'

- id: skill-badge
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: system-prompt
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
