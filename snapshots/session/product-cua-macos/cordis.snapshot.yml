- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: cua-native
      name: '@deepseek-ai/dsh-experimental-cua-macos'
      config:
        agentPreset: false
        # Header-only replay must never launch a helper or access the desktop.
        helperPath: !!js process.cwd() + '/unstarted-native-fixture'
