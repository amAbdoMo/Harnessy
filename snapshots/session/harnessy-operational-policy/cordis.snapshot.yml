- id: llm-deepseek
  disabled: true

- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- insert:
    - id: harnessy-operational-policy
      name: '../../../packages/bundle/custom-harness/src/index.ts'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-messages
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                systemPromptUpdate: in-history
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high
    - id: prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/in-history-prompt-update.ts'
