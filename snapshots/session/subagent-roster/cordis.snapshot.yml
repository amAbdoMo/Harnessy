# Keyless twin of subagent-roster.cordis.yml: keep the roster and the real
# `spawn` backend the shipped profile registers, and replace only the external
# model adapter. The parent turn is this scenario's replay override; the child
# turn is scripted from the committed child Session, which dsh-llm-replay
# derives a script from.
#
# Determinism therefore rests on a real in-process child, not a test-only
# provider: the persona, the tool restriction, and the narrowed access the
# child runs under are the values the roster's own resolution computed, and
# they are what its Session records. The seeded roles keep the shipped
# `model: fixed` with no route, so the child inherits the parent's resolved
# route — which this header class also requires, because the pin reconstructs
# the child's expected request header from the parent's and therefore fixes its
# provider and model.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# The replay adapter is a test-support package, so the shipped inventory cannot
# resolve it as an active product package.
- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-roster
      name: '@deepseek-ai/dsh-subagent-roster'
