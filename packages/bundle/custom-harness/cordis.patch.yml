# Harnessy is a narrow product layer over the shipped Web application.
# It replaces the product-owned brand and disables the per-message feedback
# Host and client rows. Shared runtime, provider, framework, and safety rows
# remain intact.

- id: web-startup
  config:
    profile: custom-harness
    productName: !!js process.env.CUSTOM_HARNESS_PRODUCT_NAME ?? 'Harnessy'

- id: message-feedback
  disabled: true

- id: ui-brand-official
  disabled: true

- id: ui-message-feedback
  disabled: true

- insert:
    # Interactive account authorization is product-visible only in Custom
    # Harness. llm-pi-ai discovers its OpenAI ChatGPT OAuth flow through this
    # neutral service and stores the resulting grant in the local credential
    # provider already mounted by the base profile.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: workspace-brief
      name: '@deepseek-ai/dsh-workspace-brief'

    # A global provider keeps Harnessy's private runtime state isolated while
    # sharing the user's normal agent skills with every preset and workspace.
    - id: harnessy-shared-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: harnessy-shared-skills
        includeDefaultRoots: false
        managedRootSettingsNamespace: harnessy-shared-skills
        managedRootDirectory: !!js "(process.env.USERPROFILE ?? process.env.HOME ?? process.cwd()) + '/.agents/skills'"
        managedRootEnabled: true

    - id: ui-brand-custom-harness
      name: '@deepseek-ai/dsh-client-ui-brand-custom-harness'

    - id: ui-workspace-brief
      name: '@deepseek-ai/dsh-client-ui-workspace-brief'
