# Tool-free replay keeps the browser-to-agent flow real without provider I/O.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  config:
    enabled: false
- id: hmr
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-messages
    model: deepseek-v4-flash
- id: preset-standard
  config:
    id: standard
    plugins: []
- id: workspace-controller
  config:
    documentsDirectory: !!js process.cwd()
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        file: !!js process.env.DSH_SNAPSHOT_FILE
        childFiles: []
        providers:
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
                name: DeepSeek-V4-Flash
                contextWindow: 1000000
